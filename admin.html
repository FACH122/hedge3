<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin ✦ Recordings</title>
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f7e7ad;
            --bg-dark: #07080c;
            --bg-card: rgba(20, 22, 32, 0.55);
            --border-gold: rgba(212, 175, 55, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        body {
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,175,55,0.07), transparent),
                var(--bg-dark);
            color: #eceae4; font-family: system-ui, sans-serif; min-height: 100vh; padding: 40px 20px;
        }
        h1 {
            text-align: center; font-size: 1.4rem; letter-spacing: 4px; margin-bottom: 30px;
            color: var(--gold-light); font-weight: 500;
        }
        .gate {
            max-width: 360px; margin: 15vh auto 0; text-align: center;
            background: var(--bg-card); border: 1px solid var(--border-gold);
            border-radius: 16px; padding: 40px 30px;
        }
        .gate input {
            width: 100%; padding: 14px; border-radius: 10px; margin-bottom: 16px;
            background: rgba(5,6,10,0.6); border: 1px solid var(--border-gold);
            color: var(--gold-light); font-size: 1rem; outline: none; text-align: center;
        }
        .gate button {
            background: linear-gradient(135deg,#bf953f,#fcf6ba,#b38728); border: none;
            color: #0a0a0a; font-weight: 600; letter-spacing: 2px; padding: 13px 34px;
            border-radius: 30px; cursor: pointer; font-size: 0.85rem;
        }
        .wrap { max-width: 760px; margin: 0 auto; }
        .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .bar span { color: #8a8276; font-size: 0.9rem; }
        .refresh {
            background: transparent; border: 1px solid var(--border-gold); color: var(--gold-light);
            padding: 9px 20px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; letter-spacing: 1px;
        }
        .item {
            background: var(--bg-card); border: 1px solid var(--border-gold);
            border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
        }
        .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
        .who { color: var(--gold-light); font-size: 0.95rem; direction: rtl; }
        .when { color: #77706a; font-size: 0.78rem; }
        audio { width: 100%; height: 40px; }
        .empty { text-align: center; color: #6e6862; padding: 60px 0; line-height: 2; }
        a.dl { color: #7da98c; font-size: 0.8rem; text-decoration: none; }
    </style>
</head>
<body>
    <div class="gate" id="gate">
        <h1>✦ Admin</h1>
        <input type="password" id="pass" placeholder="الرمز السري">
        <button onclick="tryEnter()">دخول</button>
    </div>

    <div class="wrap" id="app" style="display:none">
        <h1>🎙️ الرسائل الصوتية الواردة</h1>
        <div class="bar">
            <span id="count"></span>
            <button class="refresh" onclick="load()">↺ تحديث</button>
        </div>
        <div id="list"></div>
    </div>

    <script>
        const ADMIN_PASS = 'hajar2026';
        const SUPABASE_URL = 'https://gmjvwnqjoiloolyzwwox.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtanZ3bnFqb2lsb29seXp3d294Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Mjg5MDYsImV4cCI6MjEwMzIwNDkwNn0.lLbHjBbfVRrCM10kTWc-6Tx-ga117soIbED4qpR-s_4';

        function tryEnter() {
            if (document.getElementById('pass').value === ADMIN_PASS) {
                sessionStorage.setItem('adminOk', '1');
                enter();
            } else {
                document.getElementById('pass').value = '';
                document.getElementById('pass').placeholder = 'رمز خاطئ!';
            }
        }
        document.getElementById('pass').addEventListener('keydown', e => {
            if (e.key === 'Enter') tryEnter();
        });

        function enter() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            load();
        }

        function parseName(fname) {
            const m = fname.match(/^puzzle-(\d+)-(.+)-(\d+)\./);
            if (!m) return { who: fname, when: '' };
            return {
                riddle: parseInt(m[1]) + 1,
                who: m[2],
                ts: new Date(parseInt(m[3]))
            };
        }

        async function load() {
            const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/voices`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'apikey': SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prefix: '', limit: 200, sortBy: { column: 'created_at', order: 'desc' } })
            });
            const files = await res.json();
            const list = document.getElementById('list');
            document.getElementById('count').textContent = `${files.length} تسجيل`;

            if (!files.length) {
                list.innerHTML = '<div class="empty">لا توجد رسائل صوتية بعد...<br>ستظهر هنا فور إرسالها 🎙️</div>';
                return;
            }

            list.innerHTML = files.filter(f => f.name !== 'test-upload.webm').map(f => {
                const info = parseName(f.name);
                const url = `${SUPABASE_URL}/storage/v1/object/public/voices/${encodeURIComponent(f.name)}`;
                const when = info.ts ? info.ts.toLocaleString('ar-DZ') : '';
                return `<div class="item">
                    <div class="meta">
                        <span class="who">${info.who} — لغز رقم ${info.riddle}</span>
                        <span class="when">${when} · <a class="dl" href="${url}" target="_blank">تحميل ⬇</a></span>
                    </div>
                    <audio controls preload="none" src="${url}"></audio>
                </div>`;
            }).join('');
        }

        if (sessionStorage.getItem('adminOk') === '1') enter();
    </script>
</body>
</html>
