<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #fdf2f7; color: #44263b; min-height: 100vh; padding: 24px 14px 60px; }
        h1 { text-align: center; font-size: 1.25rem; margin-bottom: 20px; color: #c2255c; }

        .gate { max-width: 340px; margin: 14vh auto 0; background: #fff; border: 1px solid #f3d3e1;
            border-radius: 16px; padding: 36px 26px; text-align: center; box-shadow: 0 10px 30px rgba(214,51,108,.08); }
        .gate input { width: 100%; padding: 13px; border-radius: 10px; margin-bottom: 12px;
            border: 1px solid #f3d3e1; font-size: 1rem; outline: none; text-align: center; }
        .gate input:focus { border-color: #e64980; }
        .btn-main { width: 100%; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg,#f783ac,#c2255c); color: #fff; font-weight: 700; font-size: 1rem; }

        .wrap { max-width: 780px; margin: 0 auto; }
        .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 22px; border-radius: 24px; cursor: pointer; font-size: 0.92rem;
            background: #fff; border: 1px solid #f3d3e1; color: #7d5468; }
        .tab-btn.active { background: linear-gradient(135deg,#f783ac,#c2255c); color: #fff; border-color: transparent; font-weight: 700; }

        .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
        .tbtn { background: #fff; border: 1px solid #f3d3e1; color: #c2255c;
            padding: 9px 18px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
        .tbtn:hover { background: #fff0f6; }

        .card { background: #fff; border: 1px solid #f3d3e1; border-radius: 14px;
            padding: 18px; margin-bottom: 14px; direction: rtl; }
        .card label { display: block; font-size: 0.78rem; font-weight: 700; color: #c2255c; margin: 12px 0 5px; }
        .card textarea, .card input[type=text], .card input[type=number] {
            width: 100%; border: 1px solid #f3d3e1; border-radius: 9px;
            padding: 10px; font-family: inherit; font-size: 0.95rem; outline: none; color: #44263b; background: #fffbfd;
        }
        .card textarea:focus, .card input:focus { border-color: #e64980; }
        .card textarea { resize: vertical; min-height: 50px; }
        .num-row { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
        .num-badge { background: #ffe9f3; color: #c2255c; font-weight: 700; border-radius: 50%;
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
        .save { background: linear-gradient(135deg,#f783ac,#c2255c); color: #fff; border: none;
            padding: 10px 24px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
        .del { background: #fff; border: 1px solid #ffc9c9; color: #e03131;
            padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
        .status { font-size: 0.82rem; min-height: 1.2em; margin-top: 8px; }
        .status.ok { color: #2b8a3e; } .status.err { color: #e03131; }
        .rimg { max-width: 170px; max-height: 120px; border-radius: 10px; margin-top: 8px;
            border: 1px solid #f3d3e1; display: block; }

        .big-ta { width: 100%; min-height: 180px; border: 1px solid #f3d3e1; border-radius: 12px;
            padding: 14px; font-family: inherit; font-size: 1rem; line-height: 2; resize: vertical;
            outline: none; direction: rtl; color: #44263b; background: #fffbfd; }
        .hint { color: #7d5468; font-size: 0.82rem; margin: 6px 0 18px; }
        .lbl { font-size: 0.85rem; font-weight: 700; color: #c2255c; display: block; margin: 18px 0 6px; }

        .voice-item { background: #fff; border: 1px solid #f3d3e1; border-radius: 12px;
            padding: 14px; margin-bottom: 10px; direction: rtl; }
        .voice-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
            font-size: 0.85rem; margin-bottom: 8px; }
        .voice-meta b { color: #c2255c; }
        .voice-meta span { color: #7d5468; font-size: 0.78rem; }
        audio { width: 100%; height: 38px; }
        .empty { text-align: center; color: #7d5468; padding: 40px 0; line-height: 2; }
        .loading { text-align: center; color: #c2255c; padding: 30px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="gate" id="gate">
        <h1>✦ لوحة التحكم</h1>
        <input type="password" id="pass" placeholder="الرمز السري">
        <button class="btn-main" onclick="tryEnter()">دخول</button>
    </div>

    <div class="wrap" id="app" style="display:none">
        <h1>✦ إدارة الحديقة ✦</h1>
        <div class="tabs">
            <button class="tab-btn active" data-t="puzzles" onclick="showTab('puzzles')">🧩 الألغاز</button>
            <button class="tab-btn" data-t="voices" onclick="showTab('voices')">🎙️ الرسائل الصوتية</button>
            <button class="tab-btn" data-t="texts" onclick="showTab('texts')">💬 النصوص</button>
        </div>

        <!-- PUZZLES -->
        <div id="tab-puzzles">
            <div class="toolbar">
                <button class="tbtn" onclick="newPuzzle()">➕ لغز جديد</button>
                <button class="tbtn" onclick="seedDefaults()">⬇ استيراد الـ٣٠</button>
                <button class="tbtn" onclick="loadPuzzles()">↺ تحديث</button>
            </div>
            <div id="plist"><div class="loading">...جاري التحميل</div></div>
        </div>

        <!-- VOICES -->
        <div id="tab-voices" style="display:none">
            <div class="toolbar">
                <span class="tbtn" id="vcount" style="cursor:default;border:none;background:none;color:#7d5468"></span>
                <button class="tbtn" onclick="loadVoices()">↺ تحديث</button>
            </div>
            <div id="vlist"><div class="loading">...جاري التحميل</div></div>
        </div>

        <!-- TEXTS -->
        <div id="tab-texts" style="display:none">
            <label class="lbl">💬 رسالة اليوم (كل سطر = يوم)</label>
            <textarea class="big-ta" id="ta-daily"></textarea>
            <p class="hint">٧ أسطر = رسالة لكل يوم من أيام الأسبوع</p>

            <label class="lbl">🌸 ذكرى اليوم</label>
            <textarea class="big-ta" id="ta-memory"></textarea>
            <p class="hint">تتغير كل عدة أيام بالترتيب</p>

            <label class="lbl">💗 أسباب الحب (سبب في كل سطر)</label>
            <textarea class="big-ta" id="ta-reasons"></textarea>

            <div class="toolbar" style="margin-top:16px">
                <button class="save" onclick="saveTexts()">💾 حفظ النصوص</button>
                <button class="tbtn" onclick="loadTexts()">↺ استعادة</button>
            </div>
            <p class="status" id="text-status" style="text-align:center"></p>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

function tryEnter() {
    if (pass.value === ADMIN_PASS) { sessionStorage.setItem('ok','1'); enter(); }
    else { pass.value=''; pass.placeholder='رمز خاطئ!'; pass.focus(); }
}
document.getElementById('pass').addEventListener('keydown', e => { if (e.key==='Enter') tryEnter(); });

function enter() {
    gate.style.display='none'; app.style.display='block';
    loadPuzzles();
}
if (sessionStorage.getItem('ok')==='1') enter();

function showTab(t) {
    ['puzzles','voices','texts'].forEach(x => document.getElementById('tab-'+x).style.display = x===t ? '' : 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.t===t));
    if (t==='voices') loadVoices();
}

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

// ---------- PUZZLES ----------
async function loadPuzzles() {
    const el = document.getElementById('plist');
    el.innerHTML = '<div class="loading">...جاري التحميل</div>';
    try {
        const r = await fetch(`${SB_URL}/rest/v1/puzzles?select=*&order=position.asc,id.asc`, { headers: H });
        const rows = await r.json();
        if (!r.ok) throw new Error(rows.message || r.status);
        if (!rows.length) {
            el.innerHTML = '<div class="empty">لا توجد ألغاز بعد.<br>اضغط «➕ لغز جديد» أو «⬇ استيراد الـ٣٠».</div>';
            return;
        }
        el.innerHTML = rows.map((row, i) => `
            <div class="card" data-id="${row.id}">
                <div class="num-row">
                    <div class="num-badge">${i+1}</div>
                    <div style="flex:1">
                        <label>الترتيب (الأصغر يظهر أولاً)</label>
                        <input type="number" class="f-pos" value="${row.position ?? 0}">
                    </div>
                </div>
                <label>❓ السؤال</label>
                <textarea class="f-q">${esc(row.question)}</textarea>
                <label>✅ الجواب الصحيح (عدة جوابات؟ افصل بـ | )</label>
                <input type="text" class="f-a" value="${esc(row.answers)}">
                <label>🎁 نص المكافأة (تظهر لها عند الحل)</label>
                <textarea class="f-rw">${esc(row.reward_text)}</textarea>
                <label>🖼️ صورة المكافأة (اختياري)</label>
                <div class="actions" style="margin-top:4px">
                    <button class="tbtn" onclick="pickImage(this)">📁 ${row.reward_image ? 'تغيير الصورة' : 'اختيار صورة'}</button>
                    ${row.reward_image ? '<button class="tbtn" onclick="clearImage(this)">✕ بدون صورة</button>' : ''}
                </div>
                <img class="rimg" src="${esc(row.reward_image)}" style="display:${row.reward_image?'block':'none'}" onerror="this.style.display='none'">
                <input type="hidden" class="f-img" value="${esc(row.reward_image)}">
                <div class="actions">
                    <button class="save" onclick="savePuzzle(this)">💾 حفظ</button>
                    <button class="del" onclick="deletePuzzle(this)">🗑️ حذف نهائي</button>
                </div>
                <div class="status"></div>
            </div>`).join('');
    } catch (e) {
        el.innerHTML = `<div class="empty">⚠️ خطأ في التحميل: ${esc(e.message)}</div>`;
    }
}

function setStatus(card, msg, ok) {
    const s = card.querySelector('.status');
    s.textContent = msg;
    s.className = 'status ' + (ok ? 'ok' : 'err');
}

async function savePuzzle(btn) {
    const card = btn.closest('.card');
    const id = card.dataset.id;
    const data = {
        position: parseInt(card.querySelector('.f-pos').value || '0'),
        question: card.querySelector('.f-q').value.trim(),
        answers: card.querySelector('.f-a').value.trim(),
        reward_text: card.querySelector('.f-rw').value.trim(),
        reward_image: card.querySelector('.f-img').value.trim()
    };
    if (!data.question) return setStatus(card, 'اكتب السؤال أولاً', false);
    btn.disabled = true;
    setStatus(card, '...جاري الحفظ', true);
    try {
        const isNew = id === 'new';
        const r = await fetch(isNew ? `${SB_URL}/rest/v1/puzzles` : `${SB_URL}/rest/v1/puzzles?id=eq.${id}`, {
            method: isNew ? 'POST' : 'PATCH',
            headers: { ...H, Prefer: 'return=representation' },
            body: JSON.stringify(data)
        });
        if (!r.ok) throw new Error((await r.json()).message || r.status);
        setStatus(card, '✔ تم الحفظ!', true);
        setTimeout(loadPuzzles, 500);
    } catch (e) {
        setStatus(card, '✕ فشل الحفظ: ' + e.message, false);
    } finally {
        btn.disabled = false;
    }
}

async function deletePuzzle(btn) {
    const card = btn.closest('.card');
    const id = card.dataset.id;
    if (id === 'new') { card.remove(); return; }
    if (!confirm('حذف هذا اللغز نهائياً؟')) return;
    btn.disabled = true;
    setStatus(card, '...جاري الحذف', true);
    try {
        const r = await fetch(`${SB_URL}/rest/v1/puzzles?id=eq.${id}`, { method: 'DELETE', headers: H });
        if (!r.ok) throw new Error((await r.json()).message || r.status);
        card.style.opacity = '0.4';
        setStatus(card, '✔ حُذف بنجاح', true);
        setTimeout(() => { card.remove(); loadPuzzles(); }, 400);
    } catch (e) {
        setStatus(card, '✕ فشل الحذف: ' + e.message, false);
        btn.disabled = false;
    }
}

function newPuzzle() {
    const div = document.createElement('div');

            <label>🎁 نص المكافأة</label><textarea class="f-rw"></textarea>
            <label>🖼️ صورة المكافأة (اختياري)</label>
            <div class="actions" style="margin-top:4px"><button class="tbtn" onclick="pickImage(this)">📁 اختيار صورة</button></div>
            <img class="rimg" style="display:none">
            <input type="hidden" class="f-img" value="">
            <div class="actions">
                <button class="save" onclick="savePuzzle(this)">💾 إنشاء اللغز</button>
                <button class="del" onclick="this.closest('.card').remove()">✕ إلغاء</button>
            </div>
            <div class="status"></div>
        </div>`;
    document.getElementById('plist').prepend(div);
    div.scrollIntoView({ behavior: 'smooth' });
}

    loadPuzzles();
}

// ---------- IMAGES ----------
function pickImage(btn) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => inp.files[0] && uploadImg(inp.files[0], btn);
    inp.click();
}

async function uploadImg(file, btn) {
    const card = btn.closest('.card');
    const st = card.querySelector('.status');
    st.textContent = '...جاري رفع الصورة'; st.className = 'status ok';
    try {
        const ext = file.name.split('.').pop().toLowerCase();
        const fname = `reward-${Date.now()}.${ext}`;
        const r = await fetch(`${SB_URL}/storage/v1/object/rewards/${fname}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${SB_KEY}`, apikey: SB_KEY, 'Content-Type': file.type },
            body: file
        });
        if (!r.ok) throw new Error((await r.json()).message || r.status);
        const url = `${SB_URL}/storage/v1/object/public/rewards/${fname}`;
        card.querySelector('.f-img').value = url;
        const img = card.querySelector('.rimg');
        img.src = url; img.style.display = 'block';
        setStatus(card, '✔ رُفعت — اضغط 💾 حفظ لتثبيتها', true);
    } catch (e) {
        setStatus(card, '✕ فشل الرفع: ' + e.message, false);
    }
}

function clearImage(btn) {
    const card = btn.closest('.card');
    card.querySelector('.f-img').value = '';
    card.querySelector('.rimg').style.display = 'none';
    setStatus(card, 'ستُحذف الصورة بعد الضغط على حفظ', true);
}

// ---------- VOICES ----------
function parseName(f) {
    const m = f.match(/^puzzle-(\d+)-(.*)-(\d+)\./);
    return m ? { n: +m[1]+1, who: m[2], ts: new Date(+m[3]) } : null;
}

async function loadVoices() {
    const el = document.getElementById('vlist');
    try {
        const r = await fetch(`${SB_URL}/storage/v1/object/list/voices`, {
            method: 'POST', headers: H,
            body: JSON.stringify({ prefix:'', limit:200, sortBy:{ column:'created_at', order:'desc' } })
        });
        const files = (await r.json()).filter(f => f.name !== 'test-upload.webm');
        document.getElementById('vcount').textContent = files.length + ' تسجيل';
        if (!files.length) { el.innerHTML = '<div class="empty">لا رسائل صوتية بعد 🎙️</div>'; return; }
        el.innerHTML = files.map(f => {
            const info = parseName(f.name);
            const url = `${SB_URL}/storage/v1/object/public/voices/${encodeURIComponent(f.name)}`;
            const label = info ? `<b>${esc(info.who)}</b> — لغز رقم ${info.n}` : esc(f.name);
            const when = info ? info.ts.toLocaleString('ar-DZ') : '';
            return `<div class="voice-item">
                <div class="voice-meta"><span>${label}</span><span>${when} · <a href="${url}" target="_blank" style="color:#c2255c">تحميل ⬇</a></span></div>
                <audio controls preload="none" src="${url}"></audio>
            </div>`;
        }).join('');
    } catch (e) {
        el.innerHTML = `<div class="empty">⚠️ ${esc(e.message)}</div>`;
    }
}

// ---------- TEXTS ----------
async function loadTexts() {
    const r = await fetch(`${SB_URL}/rest/v1/settings?select=*`, { headers: H });
    const map = Object.fromEntries((await r.json()).map(x => [x.key, x.value]));
    ta_daily.value = (map.dailyMessages||[]).join('\n');
    ta_memory.value = (map.memoriesOfDay||[]).join('\n');
    ta_reasons.value = (map.reasons||[]).join('\n');
}

async function saveTexts() {
    const st = document.getElementById('text-status');
    st.textContent = '...جاري الحفظ'; st.className = 'status ok';
    try {
        const payload = [
            { key:'dailyMessages', value: ta_daily.value.split('\n').map(s=>s.trim()).filter(Boolean) },
            { key:'memoriesOfDay', value: ta_memory.value.split('\n').map(s=>s.trim()).filter(Boolean) },
            { key:'reasons', value: ta_reasons.value.split('\n').map(s=>s.trim()).filter(Boolean) }
        ];
        const r = await fetch(`${SB_URL}/rest/v1/settings`, {
            method: 'POST', headers: { ...H, Prefer:'resolution=merge-duplicates' },
            body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error((await r.json()).message || r.status);
        st.textContent = '✔ حُفظ — ستظهر في الموقع خلال ثوانٍ';
    } catch (e) {
        st.textContent = '✕ خطأ: ' + e.message; st.className = 'status err';
    }
}
